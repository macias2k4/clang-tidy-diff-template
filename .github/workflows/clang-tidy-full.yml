name: clang-tidy-full-analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 */14 * 1'

permissions:
  contents: read

jobs:
  clang-tidy-full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            python3 \
            python3-pip

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    #   - name: Restore clang-tidy trend cache
    #     uses: actions/cache@v4
    #     with:
    #       path: clang-tidy-trend
    #       key: clang-tidy-trend

      - name: Collect source files
        run: |
          find . \
            -type f \
            \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \) \
            ! -path "./build/*" \
            > sources.txt

      - name: Run clang-tidy (full scan)
        run: |
          mkdir -p clang-tidy-report clang-tidy-trend

          clang-tidy \
            -p build \
            $(cat sources.txt) \
            > clang-tidy-report/clang-tidy.txt || true

      - name: Count warnings
        id: count
        run: |
          WARNINGS=$(grep -E "warning:" clang-tidy-report/clang-tidy.txt | wc -l)
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

    #   - name: Update trend data
    #     run: |
    #       TREND_FILE=clang-tidy-trend/trend.csv

    #       if [ ! -f "$TREND_FILE" ]; then
    #         echo "timestamp,commit,warnings" > "$TREND_FILE"
    #       fi

    #       echo "$(date -u +%Y-%m-%d),${GITHUB_SHA::7},${{ steps.count.outputs.warnings }}" >> "$TREND_FILE"

      - name: Generate HTML report
        run: |
          pip3 install clang-html
          clang-tidy-html clang-tidy-report/clang-tidy.txt -o clang-tidy-report/html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-full-report
          path: clang-tidy-report/html

      - name: Upload trend data
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-trend
          path: clang-tidy-trend/trend.csv

      - name: Job summary (trend)
        run: |
          echo "## 🧹 Clang-Tidy – Full Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Warnings (current run):** ${{ steps.count.outputs.warnings }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Trend" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          column -t -s, clang-tidy-trend/trend.csv >> $GITHUB_STEP_SUMMARY
